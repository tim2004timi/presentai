# Docker Compose файл для запуска Jenkins
# Использование: docker-compose -f docker-compose.jenkins.yml up -d

version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-presentai
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/local/lib/docker/cli-plugins:/usr/local/lib/docker/cli-plugins
    environment:
      - JENKINS_OPTS=--httpPort=8080
    restart: unless-stopped
    networks:
      - jenkins_network

volumes:
  jenkins_data:

networks:
  jenkins_network:
    driver: bridge

