global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'presentai-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus-presentai:9090']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend-presentai:8000']
    metrics_path: '/metrics'

